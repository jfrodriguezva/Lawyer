# Un solo dominio (ecgabogados.com) sirve tanto el sitio como la API por rutas
# distintas: /api/* va al backend, todo lo demás al frontend. Al ser el mismo
# origen para el navegador, no hace falta pelear con CORS en producción.

server {
    listen 80;
    server_name ecgabogados.com www.ecgabogados.com;

    # Certbot usa esta ruta para validar el dominio antes de emitir el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Antes de tener el certificado, certbot necesita responder por HTTP aquí mismo;
    # una vez emitido, esta línea redirige todo lo demás a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# www siempre redirige al dominio raíz (301 permanente): así Google indexa una
# sola URL en vez de tratar ecgabogados.com y www.ecgabogados.com como sitios
# separados, que diluiría el posicionamiento entre los dos.
server {
    listen 443 ssl;
    http2 on;
    server_name www.ecgabogados.com;

    ssl_certificate     /etc/letsencrypt/live/ecgabogados.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecgabogados.com/privkey.pem;

    return 301 https://ecgabogados.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ecgabogados.com;

    ssl_certificate     /etc/letsencrypt/live/ecgabogados.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecgabogados.com/privkey.pem;

    client_max_body_size 55M; # el backend valida documentos hasta 50 MB

    location /api/ {
        proxy_pass http://api:5080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
