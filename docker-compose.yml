services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqldata:/var/opt/mssql
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=ECAbogados;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ECAbogados
      Jwt__Audience: ECAbogadosClients
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      Notificaciones__StaffEmail: ${STAFF_EMAIL}
      Cors__AllowedOrigins__0: https://ecgabogados.com
      Cors__AllowedOrigins__1: https://www.ecgabogados.com
      Sitio__BaseUrl: https://ecgabogados.com
    volumes:
      - documentos:/app/App_Data/documentos
      - promociones:/app/App_Data/promociones
      - logs:/app/Logs
    depends_on:
      - sqlserver
    restart: always

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://ecgabogados.com/api
        NEXT_PUBLIC_SITE_URL: https://ecgabogados.com
    depends_on:
      - api
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - api
      - frontend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

volumes:
  sqldata:
  documentos:
  promociones:
  logs:
  certbot-etc:
  certbot-webroot:
