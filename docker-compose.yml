# ECGAbogados en producción: SOLO la app (api + frontend).
#
# SQL Server y el proxy HTTPS son infraestructura compartida del VPS en ~/infra:
#   - infra-sqlserver (red "data"): la API entra con su propio login (DB_USER/DB_PASSWORD
#     en .env), con acceso solo a la BD ECAbogados.
#   - infra-caddy (red "edge", dueño de 80/443): HTTPS automático y proxy hacia
#     lawyer-frontend:3000 y lawyer-api:5080 (sitio en ~/infra/caddy/sites/ecgabogados.caddy).
# ~/infra debe estar levantado antes que esto (crea las redes edge y data).

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawyer-api
    environment:
      # appsettings.json trae "Urls": "http://localhost:5080" (para que `dotnet run`
      # local ligue solo a localhost). Dentro del contenedor eso hace que Kestrel
      # rechace las conexiones que le manda el proxy por la red interna de Docker
      # (solo escucha en su propio loopback) -- esta variable de entorno la
      # sobreescribe para que ligue a todas las interfaces.
      URLS: "http://0.0.0.0:5080"
      ConnectionStrings__Default: "Server=infra-sqlserver;Database=ECAbogados;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ECAbogados
      Jwt__Audience: ECAbogadosClients
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      Notificaciones__StaffEmail: ${STAFF_EMAIL}
      Cors__AllowedOrigins__0: https://ecgabogados.com
      Cors__AllowedOrigins__1: https://www.ecgabogados.com
      Sitio__BaseUrl: https://ecgabogados.com
    volumes:
      - documentos:/app/App_Data/documentos
      - promociones:/app/App_Data/promociones
      - logs:/app/Logs
    # edge: el proxy compartido (infra-caddy) llega a la API como "lawyer-api".
    networks:
      default:
      data:
      edge:
        aliases: [lawyer-api]
    restart: always

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        # Sin "/api": lib/api.ts arma cada ruta como `${API_URL}/api/...`, así que
        # con "/api" aquí ya incluido quedaría duplicado ("/api/api/...").
        NEXT_PUBLIC_API_URL: https://ecgabogados.com
        NEXT_PUBLIC_SITE_URL: https://ecgabogados.com
    container_name: lawyer-frontend
    depends_on:
      - api
    # edge: el proxy compartido (infra-caddy) llega al frontend como "lawyer-frontend".
    networks:
      default:
      edge:
        aliases: [lawyer-frontend]
    restart: always

networks:
  data:
    external: true
    name: data
  edge:
    external: true
    name: edge

# Los archivos subidos viven aquí (lawyer_documentos, lawyer_promociones), no en la imagen.
volumes:
  documentos:
  promociones:
  logs:
